<script>

const SERVER=!!window.__BOOT__;const BOOT=window.__BOOT__||{admin:false};
var _sync={dirty:0,timer:null,busy:false,again:false};
function load(){if(SERVER)return BOOT.state||null;try{const r=localStorage.getItem("lj_store");return r?JSON.parse(r):null}catch(e){return null}}
function queueSave(){_sync.dirty++;clearTimeout(_sync.timer);_sync.timer=setTimeout(pushState,500)}
async function pushState(){
 if(!SERVER||!BOOT.admin)return;
 if(_sync.busy){_sync.again=true;return}
 clearTimeout(_sync.timer);_sync.busy=true;
 const sent=_sync.dirty;
 try{
  const r=await fetch("/api/admin/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:S,baseVersion:BOOT.version})});
  const d=await r.json().catch(function(){return{}});
  if(r.status===401){toast("Your session has ended. Please log in again.");setTimeout(function(){location.href="/"},1500);return}
  if(!r.ok){toast(d.error||"Could not save your changes.");setTimeout(function(){location.reload()},2000);return}
  if(sent===_sync.dirty){
    S=d.state;snap=null;BOOT.version=d.version;
    if(d.merged&&!document.querySelector("input:focus,textarea:focus,select:focus")){toast("New online orders received");render()}
  }else{_sync.again=true}
 }catch(e){toast("Connection lost. Your last changes are not saved yet.")}
 finally{_sync.busy=false;if(_sync.again){_sync.again=false;pushState()}}
}
async function serverLogin(){
 const el=document.getElementById("pin");const v=el?el.value:"";
 let r,d={};
 try{r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:v})});d=await r.json().catch(function(){return{}})}
 catch(e){return toast("Connection problem. Try again.")}
 if(!r.ok)return toast(d.error||"Wrong password. Try again.");
 sessionStorage.setItem("lj_mode","admin");location.reload();
}
async function serverCheckout(){
 const g=function(i){const el=document.getElementById(i);return el?el.value.trim():""};
 if(!g("cn")||!g("cp")||!g("ca"))return toast("Enter name, phone and delivery address");
 if(!cart.length)return toast("Your cart is empty");
 const payload={name:g("cn"),phone:g("cp"),email:g("ce"),address:g("ca"),coupon:g("cc"),method:g("cm"),
  items:cart.map(function(c){return{id:c.id,j:c.j,n:c.n}})};
 let d={},r;
 try{r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});d=await r.json().catch(function(){return{}});
  if(!r.ok){toast(d.error||"Could not place the order. Try again.");if(r.status===409)refreshPublic().then(render);return}}
 catch(e){return toast("Connection problem. Please try again.")}
 const o=d.order;lastOrder=o.id;cart=[];tab="track";
 if(!BOOT.admin){S.orders=[o];await refreshPublic()}
 toast("Order "+o.id+" placed");render();scrollTo(0,0);
}
async function refreshPublic(){
 if(BOOT.admin)return;
 try{const r=await fetch("/api/public",{cache:"no-store"});if(!r.ok)return;const p=await r.json();S.products=p.products;S.coupons=p.coupons}catch(e){}
}
async function trackFind(){
 const el=document.getElementById("tid");const q=el?el.value.trim():"";
 lastOrder=q.toUpperCase();
 if(q&&!BOOT.admin){
  try{const r=await fetch("/api/track?q="+encodeURIComponent(q),{cache:"no-store"});const d=await r.json();
   S.orders=d.orders||[];if(S.orders.length&&!S.orders.some(function(x){return x.id==lastOrder}))lastOrder=S.orders[0].id}
  catch(e){S.orders=[]}
 }
 render();
}

function labelList(o){const out=[];S.products.filter(p=>o.sel=="all"||o.sel=="low"||p.id==o.sel).forEach(p=>p.v.forEach(v=>{if(o.sel=="low"&&v.q>S.low)return;for(let k=0;k<o.n;k++)out.push({p,v})}));return out}
function labelHTML(it,o,P){const {p,v}=it,sh=S.shop||{name:"LEUCO JUBATUS"};
  return`<div style="width:${P.w}mm;height:${P.h}mm;overflow:hidden;box-sizing:border-box;padding:1.5mm;background:#fff;color:#000;text-align:center;font-family:Helvetica,Arial,sans-serif"><div style="font-weight:700;font-size:${P.w<45?"7":"9"}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>${o.vc?`<div style="font-size:${P.w<45?"6":"8"}px">${esc(v.s)} / ${esc(v.c)}</div>`:""}${o.pr?`<div style="font-size:${P.w<45?"6":"8"}px">${rs(p.price)}</div>`:""}${o.st?`<div style="font-size:${P.w<45?"5":"7"}px">${esc(sh.name)}</div>`:""}<svg data-bc="${esc(v.bc)}" style="width:100%;height:${Math.max(8,P.h-(o.pr?0:0)-16)}mm;max-height:${P.h*0.6}mm"></svg></div>`}
function setPageCSS(P){let s=document.getElementById("lbpage");if(!s){s=document.createElement("style");s.id="lbpage";document.head.appendChild(s)}s.textContent=`@page{size:${P.pw}mm ${P.ph}mm;margin:${P.m}mm}@media print{#bclabels{display:grid!important;grid-template-columns:repeat(${P.cols},${P.w}mm)!important;gap:0!important;margin:0!important}#bclabels>div{break-inside:avoid}}`}
function clearPageCSS(){const s=document.getElementById("lbpage");if(s)s.remove()}
function bcMake(){ensureBC();const o=bopt(),P=PAP[o.pap],L=labelList(o);
  if(!L.length)return toast(o.sel=="low"?"No products are low on stock":"No products to make labels for yet");
  const g=document.getElementById("bclabels");g.style.gridTemplateColumns="repeat("+P.cols+","+P.w+"mm)";g.style.gap="2mm";
  g.innerHTML=L.map(it=>labelHTML(it,o,P)).join("");setPageCSS(P);bcDraw();
  document.getElementById("bcmsg").textContent=L.length+" label(s) ready. Press Print labels to print.";}
async function bcDraw(){
  if(!window.JsBarcode){try{await loadScript(BCJS)}catch(e){return toast("Could not load the barcode tool. Check your internet connection.")}}
  document.querySelectorAll("svg[data-bc]").forEach(s=>{try{JsBarcode(s,s.dataset.bc,{format:"CODE128",width:2,height:50,fontSize:14,margin:2,displayValue:true})}catch(e){}})}
function bcPrint(){const o=bopt(),P=PAP[o.pap];if(!document.querySelector("#bclabels svg[data-bc]"))bcMake();
  if(!document.querySelector("#bclabels svg[data-bc]"))return;setPageCSS(P);
  window.onafterprint=()=>{clearPageCSS();window.onafterprint=null};window.print();setTimeout(clearPageCSS,1500)}
const BARIMG={};
async function barImg(code){if(BARIMG[code])return BARIMG[code];
  const c=document.createElement("canvas");JsBarcode(c,code,{format:"CODE128",width:3,height:90,fontSize:22,margin:4,displayValue:true});
  return BARIMG[code]={url:c.toDataURL("image/png"),ar:c.width/c.height}}
function drawLabel(d,it,x,y,P,o,sh){const {p,v}=it,small=P.w<45,fs=small?5.5:7,lh=small?2.5:3.2;let ty=y+3.6;
  d.setTextColor(0);d.setFont("helvetica","bold");d.setFontSize(fs);d.text(String(p.name).slice(0,small?16:26),x+P.w/2,ty,{align:"center"});ty+=lh;
  d.setFont("helvetica","normal");d.setFontSize(fs-1);
  if(o.vc){d.text(v.s+" / "+v.c,x+P.w/2,ty,{align:"center"});ty+=lh}
  if(o.pr){d.text("Rs. "+Number(p.price).toLocaleString("en-US"),x+P.w/2,ty,{align:"center"});ty+=lh}
  if(o.st){d.setFontSize(fs-2);d.text(String(sh.name),x+P.w/2,ty,{align:"center"});ty+=lh}
  return {ty}}
async function labelsPdf(){
  if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");
  if(!window.JsBarcode){try{await loadScript(BCJS)}catch(e){return toast("Could not load the barcode tool. Check your internet connection.")}}
  ensureBC();const o=bopt(),P=PAP[o.pap],L=labelList(o),sh=S.shop||{name:"LEUCO JUBATUS"};
  if(!L.length)return toast("No products to make labels for yet");
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),rows=Math.floor((P.ph-2*P.m)/P.h),per=P.cols*rows;
  for(let i=0;i<L.length;i++){
    if(i>0&&i%per==0)d.addPage();
    const idx=i%per,x=P.m+(idx%P.cols)*P.w,y=P.m+Math.floor(idx/P.cols)*P.h;
    const it=L[i],{ty}=drawLabel(d,it,x,y,P,o,sh),bi=await barImg(it.v.bc);
    const avail=y+P.h-ty-1.5,aw=P.w-5;let iw=aw,ih=aw/bi.ar;if(ih>avail){ih=avail;iw=ih*bi.ar}
    d.addImage(bi.url,"PNG",x+(P.w-iw)/2,ty+0.5,iw,ih);
  }
  d.save("barcode-labels-"+lgToday()+".pdf")}
function barcodeCsv(){ensureBC();let c="Barcode,Product,Size,Colour,Price (Rs.),Stock\n";
  S.products.forEach(p=>p.v.forEach(v=>{c+=[v.bc,p.name,v.s,v.c,p.price,v.q].map(csvc).join(",")+"\n"}));
  dl("barcode-list-"+lgToday()+".csv","\ufeff"+c);toast("Barcode list downloaded")}
async function scanStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast("This browser cannot use the camera. Open the store link in Chrome or Safari.");
  try{await loadScript(SCANJS)}catch(e){return toast("Could not load the scanner. Check your internet connection.")}
  if(QR)await scanStop();
  try{
    QR=new Html5Qrcode("lj-reader",{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.CODE_39],verbose:false});
    await QR.start({facingMode:"environment"},{fps:10,qrbox:(w,h)=>({width:Math.min(320,Math.floor(w*0.9)),height:Math.min(150,Math.floor(h*0.45))})},code=>scanFound(code),()=>{});
    document.getElementById("scmsg").textContent="Camera on. Point it at a barcode.";
  }catch(e){QR=null;toast("Camera could not start. Allow camera access in your browser settings and use the https store link.")}}
async function scanStop(){if(!QR)return;const q=QR;QR=null;try{if(q.isScanning)await q.stop();q.clear()}catch(e){}}
function scanFound(code){const now=Date.now();if(code==SCL&&now-SCT<2500)return;SCL=code;SCT=now;
  if(navigator.vibrate)navigator.vibrate(80);
  if(QR)try{QR.pause(true)}catch(e){}
  scanLookup(code)}
function scanResume(){SCL="";if(QR)try{QR.resume()}catch(e){}const r=document.getElementById("scres");if(r)r.innerHTML="";const m=document.getElementById("scmsg");if(m)m.textContent="Camera on. Point it at a barcode."}
function scanLookup(raw){const code=String(raw||"").trim().toUpperCase();const el=document.getElementById("scres");if(!el)return;
  const hit=findBC(code);
  if(!hit){el.innerHTML=`<div class="card" style="margin-top:12px"><b>Not found:</b> ${esc(code)}<p class="mut">No product has this barcode. Make labels first, or check the code.</p>${QR?'<button class="btn sm" onclick="scanResume()">Scan next</button>':""}</div>`;return}
  const {p,j,v}=hit,inCart=cart.filter(c=>c.id==p.id&&c.j==j).reduce((a,c)=>a+c.n,0);
  SLOG.unshift({t:new Date().toLocaleTimeString(),code,name:p.name,s:v.s,c:v.c});if(SLOG.length>30)SLOG.pop();renderHist();
  el.innerHTML=`<div class="card" style="margin-top:12px"><h3>${esc(p.name)}</h3><p class="mut">${esc(v.s)} / ${esc(v.c)} · ${rs(p.price)} · Stock ${v.q}${inCart?" · In sale cart: "+inCart:""}</p>
  <div class="row"><button class="btn" onclick="scanStock(${p.id},${j})">+1 stock</button><button class="btn alt" onclick="scanSale(${p.id},${j})">Add to quick sale</button>${QR?'<button class="btn alt" onclick="scanResume()">Scan next</button>':""}</div></div>`}
function renderHist(){const h=document.getElementById("schist");if(!h)return;
  h.innerHTML=SLOG.length?`<div class="row" style="margin-top:12px"><b style="flex:1">Scan history (this session)</b><button class="btn alt sm" onclick="SLOG=[];renderHist()">Clear</button></div>`+SLOG.map(x=>`<div class="row" style="border-top:1px solid var(--line);padding:6px 0"><span class="mut" style="width:80px">${x.t}</span><span style="flex:1">${esc(x.name)} <span class="mut">${esc(x.s)}/${esc(x.c)}</span></span><button class="btn alt sm" onclick="scanLookup('${x.code}')">Open</button></div>`).join(""):'<p class="mut" style="margin-top:10px">Scanned items appear here.</p>'}
function scanStock(id,j){const p=S.products.find(x=>x.id==id);if(!p||!p.v[j])return;p.v[j].q++;save();toast("Stock +1: "+p.name+" "+p.v[j].s+" / "+p.v[j].c+" now "+p.v[j].q);scanLookup(p.v[j].bc)}
function scanSale(id,j){const p=S.products.find(x=>x.id==id);if(!p||!p.v[j])return;const v=p.v[j],ex=cart.find(c=>c.id==id&&c.j==j),n=(ex?ex.n:0)+1;
  if(n>v.q)return toast("No stock left for "+v.s+" / "+v.c);
  ex?ex.n++:cart.push({id,j,name:p.name,price:p.price,s:v.s,c:v.c,n:1});
  toast("Added to quick sale. Open Quick sale to bill.");scanLookup(v.bc)}

  <div class="row noprint"><select id="bcp"><option value="all">All products</option><option value="low">Low stock only</option>${opts}</select><label class="mut">Copies each <input id="bcc" type="number" min="1" max="200" value="1" style="width:80px"></label></div>
  <div class="row noprint"><select id="bpap">${paps}</select></div>
  <div class="row noprint"><label><input type="checkbox" id="bpr" checked> Price</label><label><input type="checkbox" id="bst" checked> Store name</label><label><input type="checkbox" id="bvc" checked> Size / colour</label></div>
  <div class="row noprint"><button class="btn" onclick="bcMake()">Show labels</button><button class="btn alt" onclick="bcPrint()">Print labels</button><button class="btn alt" onclick="labelsPdf()">Download labels PDF</button><button class="btn alt" onclick="barcodeCsv()">Barcode list (CSV)</button></div>
  <p class="mut noprint" id="bcmsg" style="margin:0 0 8px"></p>
  <div id="bclabels" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:6px"><p class="mut">Choose products and press Show labels.</p></div></div>
  <div class="card noprint"><h2>2. Scan with camera</h2><p class="mut">Point the phone camera at a barcode. Allow camera access when asked. Needs the store opened over https (the published link).</p>
  <div class="row"><button class="btn" onclick="scanStart()">Open camera</button><button class="btn alt" onclick="scanStop().then(()=>{document.getElementById('scmsg').textContent='Camera off.'})">Stop camera</button></div>
  <div id="lj-reader" style="width:100%;max-width:420px;border-radius:12px;overflow:hidden"></div>
  <p class="mut" id="scmsg" style="margin:6px 0 0">Camera off.</p>
  <div class="row" style="margin-top:8px"><input id="bcm" placeholder="Or type a barcode, e.g. LJ1001" style="flex:1;min-width:160px" onkeydown="if(event.key=='Enter')scanLookup(this.value)"><button class="btn sm" onclick="scanLookup(document.getElementById('bcm').value)">Find</button></div>
  <div id="scres"></div><div id="schist"></div></div></div>`};

 <div class="card scroll"><div class="row"><h3 style="margin:0;flex:1">Customers (${S.customers.length})</h3>${tagSel()}<input placeholder="Search name, phone, email" value="${esc(CQ)}" oninput="searchCust(this.value)"><button class="btn alt sm" onclick="custCsv()">Download list (CSV)</button></div><div id="ctab">${custTable()}</div></div>`};

/* ===== Person reports: one report per person, built from Notes & Money records ===== */
var PR={q:"",view:"",sel:[]};
var prepSig="";
const pKey=n=>String(n||"").trim().toLowerCase();
const ek=k=>encodeURIComponent(k).replace(/'/g,"%27");
const pSgn=b=>(b<0?"-":"")+rs(Math.abs(b));
const pStatus=b=>b>0?"Given more":b<0?"Received more":"Settled";
function pSig(){return JSON.stringify([S.money,S.givenOut])}
function prepPeople(){
  const map={};
  const add=(name,t)=>{const n=String(name||"").trim();if(!n)return;const k=pKey(n);if(!map[k])map[k]={key:k,name:n,tx:[]};map[k].tx.push(t)};
  (S.money||[]).forEach(m=>add(m.name,{id:String(m.id),date:m.date||"",type:m.type==="received"?"received":"given",amount:+m.amount||0,reason:m.reason||"",src:"Money record"}));
  (S.givenOut||[]).forEach(g=>add(g.to,{id:String(g.id),date:g.date||"",type:"given",amount:+g.amount||0,reason:g.note||"",src:"Given to"}));
  return Object.values(map).map(p=>{
    p.tx.sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
    let run=0;p.tx.forEach(t=>{run+=t.type==="given"?t.amount:-t.amount;t.bal=run});
    p.given=p.tx.filter(t=>t.type==="given").reduce((a,t)=>a+t.amount,0);
    p.received=p.tx.filter(t=>t.type==="received").reduce((a,t)=>a+t.amount,0);
    p.balance=p.given-p.received;
    p.last=p.tx.length?p.tx[p.tx.length-1].date:"";
    return p;
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
function prepList(){const q=pKey(PR.q);return prepPeople().filter(p=>!q||p.name.toLowerCase().includes(q))}
function prepTable(p){
  return `<div class="scroll"><table><tr><th>Date</th><th>Type</th><th>Reason</th><th>Amount</th><th>Balance</th></tr>${p.tx.map(t=>`<tr><td>${esc(t.date||"-")}</td><td><span class="tag ${t.type=="given"?"bad":"ok"}">${t.type=="given"?"Given":"Received"}</span></td><td>${esc(t.reason||"")}${t.src=="Given to"?'<br><span class="mut">Given-to record</span>':""}</td><td>${rs(t.amount)}</td><td>${pSgn(t.bal)}</td></tr>`).join("")}</table></div>`;
}
function pStats(p){
  return `<div class="stats" style="margin:12px 0"><div class="stat"><span class="mut">Transactions</span><b>${p.tx.length}</b></div><div class="stat"><span class="mut">Given</span><b>${rs(p.given)}</b></div><div class="stat"><span class="mut">Received</span><b>${rs(p.received)}</b></div><div class="stat"><span class="mut">Balance</span><b>${pSgn(p.balance)}</b><span class="mut">${pStatus(p.balance)}</span></div></div>`;
}
function prepCards(L){
  if(!L.length)return '<p class="mut">No people found.</p>';
  return `<div class="grid">${L.map(p=>{const k=ek(p.key),on=PR.sel.includes(p.key);return `<div class="card" style="margin:0;display:flex;flex-direction:column;gap:6px">
    <div class="row" style="margin:0;justify-content:space-between;flex-wrap:nowrap"><label class="row" style="margin:0;gap:8px;min-width:0;cursor:pointer"><input type="checkbox" style="width:18px;height:18px;flex:none" ${on?"checked":""} onchange="prepTog('${k}',this.checked)"><b style="overflow-wrap:anywhere">${esc(p.name)}</b></label><span class="tag">${p.tx.length} transaction${p.tx.length==1?"":"s"}</span></div>
    <div class="mut">Last activity: ${esc(p.last||"-")}</div>
    <div class="row" style="margin:0;gap:14px"><span>Given <b>${rs(p.given)}</b></span><span>Received <b>${rs(p.received)}</b></span></div>
    <div><span class="tag acc">Balance ${pSgn(p.balance)} · ${pStatus(p.balance)}</span></div>
    <div class="row" style="margin:6px 0 0"><button class="btn sm" onclick="prepView('${k}')">View report</button><button class="btn alt sm" onclick="prepPdf('one','${k}')">Download PDF</button></div>
  </div>`}).join("")}</div>`;
}
V.prep=function(){
  const all=prepPeople();
  PR.sel=PR.sel.filter(k=>all.some(p=>p.key==k));
  const view=all.find(p=>p.key==PR.view);
  if(PR.view&&!view)PR.view="";
  prepSig=pSig();
  const tg=all.reduce((a,p)=>a+p.given,0),tr=all.reduce((a,p)=>a+p.received,0);
  const rep=view?`<div class="card" id="prep-rep"><div class="row" style="justify-content:space-between;margin-bottom:0"><h2 style="margin:0">Report: ${esc(view.name)}</h2><button class="btn alt sm" onclick="prepClose()">Close</button></div>
    <p class="mut" style="margin:8px 0 0">Transactions in date order. Balance after each row = total given minus total received so far.</p>
    ${pStats(view)}${prepTable(view)}
    <div class="row" style="margin-top:12px"><button class="btn" onclick="prepPdf('one','${ek(view.key)}')">Download PDF</button></div></div>`:"";
  return `<div class="card"><h2>Person reports</h2>
    <p class="mut">One report per person, built from your Notes &amp; Money records (money given or received, and Given to records). Reports update automatically when data changes.</p>
    <div class="stats" style="margin:12px 0"><div class="stat"><span class="mut">People</span><b>${all.length}</b></div><div class="stat"><span class="mut">Total given</span><b>${rs(tg)}</b></div><div class="stat"><span class="mut">Total received</span><b>${rs(tr)}</b></div></div>
    <div class="row"><input placeholder="Search by name" value="${esc(PR.q)}" oninput="prepSearch(this.value)" aria-label="Search people" style="flex:1;min-width:180px"></div>

var SP={q:"",view:"",sel:[],form:null};
var suppSig="";
const spKey=n=>String(n||"").trim().toLowerCase();

function spFormGet(){if(!SP.form)SP.form={sup:"",inv:"",date:"",paid:"",items:[spNewItem()]};return SP.form}
function spReadForm(){
  const f=SP.form;if(!f)return;
  const g=id=>{const e=document.getElementById(id);return e?e.value:null};
  if(g("sp_sup")===null)return;
  f.sup=g("sp_sup");f.inv=g("sp_inv");f.date=g("sp_dt");f.paid=g("sp_paid");
  f.items=f.items.map((it,i)=>({name:g("sp_n"+i)??it.name,s:g("sp_s"+i)??it.s,c:g("sp_c"+i)??it.c,q:g("sp_q"+i)??it.q,cost:g("sp_k"+i)??it.cost}));
}

function spRemItem(i){spReadForm();const f=spFormGet();if(f.items.length>1)f.items.splice(i,1);render()}
function spSave(){
  spReadForm();const f=spFormGet(),sup=String(f.sup||"").trim();
  if(!sup)return toast("Enter the supplier name");
  const items=f.items.map(it=>({name:String(it.name||"").trim(),s:String(it.s||"").trim(),c:String(it.c||"").trim(),q:+it.q||0,cost:+it.cost||0})).filter(it=>it.name||it.q||it.cost);
  if(!items.length)return toast("Add at least one product");
  if(items.some(it=>!it.name))return toast("Every product needs a name");
  if(items.some(it=>!(it.q>0)))return toast("Every product needs a quantity greater than 0");
  if(items.some(it=>it.cost<0))return toast("Unit cost cannot be negative");
  const total=items.reduce((a,it)=>a+it.q*it.cost,0),paid=+f.paid||0;
  if(paid<0)return toast("Paid amount cannot be negative");
  if(paid>total)return toast("Paid amount cannot be more than the invoice total");
  S.purchases=S.purchases||[];
  S.purchases.push({id:"p"+Date.now(),sup,inv:String(f.inv||"").trim(),date:f.date||dkey(Date.now()),items,paid});
  SP.form=null;save();toast("Invoice saved");render();
}
function spDel(id){
  const p=(S.purchases||[]).find(x=>x.id==id);if(!p)return;
  if(!confirm("Delete invoice "+(p.inv||"(no number)")+" from "+p.sup+"?"))return;
  S.purchases=S.purchases.filter(x=>x.id!=id);save();toast("Invoice deleted");render();
}
function spPeople(){
  const map={};
  (S.purchases||[]).forEach(p=>{const n=String(p.sup||"").trim();if(!n)return;const k=spKey(n);if(!map[k])map[k]={key:k,name:n,list:[]};map[k].list.push(p)});
  return Object.values(map).map(s=>{
    const sorted=[...s.list].sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id)));
    let run=0;
    s.list=sorted.map(p=>{const total=p.items.reduce((a,it)=>a+it.q*it.cost,0),paid=+p.paid||0;run+=total-paid;return {...p,total,paid,bal:run}});
    s.total=s.list.reduce((a,p)=>a+p.total,0);
    s.paid=s.list.reduce((a,p)=>a+p.paid,0);
    s.balance=s.total-s.paid;
    s.qty=s.list.reduce((a,p)=>a+p.items.reduce((x,it)=>x+it.q,0),0);

  y=58;d.setTextColor(20);d.setFont("helvetica","bold");d.text("Bill to:",15,y);d.setFont("helvetica","normal");d.text(String(p.cust),32,y);

  y+=5;d.setTextColor(20);d.setFont("helvetica","bold");d.text("Item",15,y);d.text("Qty",125,y,{align:"right"});d.text("Price",160,y,{align:"right"});d.text("Amount",R,y,{align:"right"});d.line(15,y+2,R,y+2);d.setFont("helvetica","normal");y+=9;
  p.items.forEach(i=>{if(y>240){d.addPage();y=20}d.setTextColor(20);d.text(String(i.name),15,y);d.setTextColor(110);d.setFontSize(9);d.text(i.s+" / "+i.c,15,y+4.5);d.setFontSize(10);d.setTextColor(20);
    d.text(String(i.n),125,y,{align:"right"});d.text(mon(i.price||0),160,y,{align:"right"});d.text(mon((i.price||0)*i.n),R,y,{align:"right"});y+=11;d.line(15,y-5,R,y-5)});

function saveFile(blob,fn){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function sendReceipt(p,how){

      if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Receipt "+p.no,text}).catch(e=>{if(!e||e.name!="AbortError")saveFile(blob,fn)});return}}catch(e){}
  }
  saveFile(blob,fn);
  if(how=="pdf")return toast("Receipt PDF downloaded");
  const num=waNum(p.phone);
  if(!num)return toast("Receipt downloaded. This customer has no WhatsApp number saved.");

if(!ADM.some(a=>a[0]=="old"))ADM.splice(ADM.findIndex(a=>a[0]=="ord")+1,0,["old","Add old order"]);
V.old=function(){const inp=(i,ph,t,w)=>`<input id="${i}" ${t?`type="${t}"`:""} placeholder="${ph}" style="${w?"width:"+w+"px":"flex:1;min-width:150px"}">`;
return`<div class="card"><h3>Add an old order</h3><p class="mut">Record past orders so your reports, customers and bills include them. Stock is not changed.</p>
<div class="row"><label class="mut">Order date</label>${inp("oo_date","","date",160)}${inp("oo_id","Order ID (optional, auto if empty)")}</div>
<div class="row">${inp("oo_name","Customer name")}${inp("oo_ph","Phone")}</div>
<div class="row">${inp("oo_addr","Delivery address")}</div>
<p class="mut" style="margin:6px 0 4px">Items, one per line: <b>Name, Size, Color, Qty, Price</b></p>
<textarea id="oo_items" rows="4" placeholder="Prowl Relaxed Pants - Navy, 28, Navy, 1, 1899" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;color:inherit"></textarea>
<div class="row" style="margin-top:8px">${inp("oo_ship","Shipping","number",110)}${inp("oo_disc","Discount","number",110)}${inp("oo_code","Coupon code",0,130)}${inp("oo_trk","Tracking no.")}</div>
<div class="row"><select id="oo_meth"><option>Cash on Delivery</option><option>Bank transfer</option><option>Card</option></select><select id="oo_pay"><option>Paid</option><option>Pending</option></select><select id="oo_st">${STAT.map(x=>`<option ${x=="Delivered"?"selected":""}>${x}</option>`).join("")}</select></div>
<div class="row"><button class="btn" onclick="saveOld()">Save old order</button></div></div>`};
function saveOld(){const g=i=>document.getElementById(i).value.trim();
 const items=g("oo_items").split("\n").map(l=>l.split(",").map(x=>x.trim())).filter(a=>a[0]).map(a=>({name:a[0],s:a[1]||"-",c:a[2]||"-",n:+a[3]||1,price:+a[4]||0}));
 if(!g("oo_name")||!items.length)return toast("Enter the customer name and at least one item");
 const d=g("oo_date")?new Date(g("oo_date")+"T12:00:00"):new Date(),ph=g("oo_ph");
 let id=g("oo_id");if(id&&S.orders.some(o=>o.id==id))return toast("That order ID already exists");if(!id)id=newId(ph);
 let cu=ph?S.customers.find(c=>c.phone==ph):null;if(ph&&!cu){cu={id:S.cid++,name:g("oo_name"),phone:ph,email:"",addr:g("oo_addr")};S.customers.push(cu)}
 const sub=items.reduce((a,i)=>a+i.price*i.n,0),disc=+g("oo_disc")||0,ship=+g("oo_ship")||0;
 S.orders.push({id,cid:cu?cu.id:0,cust:g("oo_name"),phone:ph,addr:g("oo_addr")||"-",items,sub,disc,code:disc?g("oo_code").toUpperCase():"",ship,total:sub-disc+ship,method:document.getElementById("oo_meth").value,ts:d.getTime(),status:document.getElementById("oo_st").value,payStatus:document.getElementById("oo_pay").value,track:g("oo_trk"),date:d.toLocaleDateString()});
 S.orders.sort((a,b)=>(b.ts||0)-(a.ts||0));notify("Old order "+id+" added for "+g("oo_name"));save();toast("Old order "+id+" saved");showBill(id)}
</script>
<script>
/* ===== Delivery note image (auto + manual) ===== */
S.orders=S.orders||[];S.customers=S.customers||[];S.notes=S.notes||[];S.coupons=S.coupons||[];S.nid=S.nid||1;S.cid=S.cid||1;S.pid=S.pid||100;S.ship=S.ship??350;S.low=S.low??5;

/* Opens a print window synchronously on click so browsers do not block it */
function openPrintWin(){
 const w=window.open("","_blank");
 if(!w){toast("Allow pop-ups for this site to print.");return null}
 try{w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Print</title></head><body style="font-family:Arial,sans-serif;padding:20px">Preparing...</body></html>');w.document.close()}catch(e){}
 return w;
}
/* Receipt-style delivery note for thermal (80mm roll) printers */
function receiptHtml(o){
 const sh=S.shop||{name:"LEUCO JUBATUS"},items=o.items||[];
 const money=n=>"Rs. "+Number(n||0).toLocaleString("en-US");
 const sub=o.sub??items.reduce((a,i)=>a+(i.price||0)*i.n,0),ship=o.ship??S.ship;
 const line=(l,r)=>'<div class="row2"><span>'+esc(l)+'</span><span>'+esc(r)+'</span></div>';
 const itemsHtml=items.map((i,k)=>'<div class="it">'+(k+1)+'. '+esc(i.name)+'</div>'+
   '<div class="row2 sm"><span>'+esc((i.s||'')+(i.c?' / '+i.c:''))+' x'+esc(i.n)+'</span><span>'+money((i.price||0)*i.n)+'</span></div>').join('');
 return '<!doctype html><html><head><meta charset="utf-8"><title>Receipt '+esc(o.id)+'</title><style>'+
 '@page{size:'+(S.rcptW||80)+'mm auto;margin:3mm}'+
 'html,body{margin:0;padding:0;background:#fff;color:#000}'+
 'body{width:'+((S.rcptW||80)-8)+'mm;font-family:"Courier New",Courier,monospace;font-size:12px;line-height:1.35}'+
 '.c{text-align:center}.b{font-weight:bold}.hr{border-top:1px dashed #000;margin:5px 0}'+
 '.row2{display:flex;justify-content:space-between;gap:6px}.sm{font-size:11px}.it{margin-top:4px;font-weight:bold}'+
 '.big{font-size:15px;font-weight:bold}.wrap{word-wrap:break-word}'+
 '</style></head><body>'+
 '<div class="c b big">'+esc(sh.name||'LEUCO JUBATUS')+'</div>'+
 (sh.addr?'<div class="c sm wrap">'+esc(sh.addr)+'</div>':'')+
 (sh.phone?'<div class="c sm">Tel: '+esc(sh.phone)+'</div>':'')+
 '<div class="hr"></div>'+
 '<div class="c b">DELIVERY NOTE</div>'+
 line('Note No',o.id)+line('Date',o.date||'')+
 '<div class="hr"></div>'+
 '<div class="b">To:</div><div class="wrap">'+esc(o.cust||'-')+'</div>'+
 '<div class="wrap sm">'+esc(o.addr||'-')+'</div>'+
 '<div class="sm">Phone: '+esc(phoneOf(o)||'-')+'</div>'+
 '<div class="hr"></div>'+
 itemsHtml+
 '<div class="hr"></div>'+
 line('Subtotal',money(sub))+
 (o.disc?line('Discount'+(o.code?' ('+o.code+')':''),'- '+money(o.disc)):'')+
 line('Shipping',money(ship))+
 '<div class="hr"></div>'+
 '<div class="row2 big"><span>TOTAL</span><span>'+money(o.total)+'</span></div>'+
 '<div class="hr"></div>'+
 '<div class="b">'+((o.payStatus!="Paid"&&o.payStatus!="Refunded")?'COD - collect cash':'PREPAID')+'</div>'+
 (o.track?line('Tracking',o.track):'')+(o.crate?line('Crate',o.crate):'')+
 '<div class="hr"></div>'+
 '<div class="c sm">Thank you for shopping with '+esc(sh.name||'LEUCO JUBATUS')+'.</div>'+
 '<div style="height:14mm"></div>'+
 '</body></html>';
}
function printReceipt(id,w){
 const o=ord(id);
 if(!o){if(w)w.close();return toast("Order not found.")}
 const win=w||openPrintWin();if(!win)return;
 try{
  win.document.open();win.document.write(receiptHtml(o));win.document.close();
  setTimeout(()=>{try{win.focus();win.print()}catch(e){toast("Printing blocked. Allow pop-ups and try again.")}},300);
 }catch(e){toast("Could not open the receipt.")}
}

async function printA4Note(id,w){
 const o=ord(id);
 if(!o){if(w)w.close();return toast("Order not found.")}
 const win=w||openPrintWin();if(!win)return;
 let bc="";
 try{if(typeof JsBarcode!=="undefined")bc=(await barImg(String(o.id).replace(/^#/,""))).url}catch(e){}
 try{
  win.document.open();win.document.write(a4Html(o,bc));win.document.close();
  const go=()=>setTimeout(()=>{try{win.focus();win.print()}catch(e){toast("Printing blocked. Allow pop-ups and try again.")}},300);
  const img=win.document.querySelector("img");
  if(img&&!img.complete){img.onload=go;img.onerror=go}else go();
 }catch(e){toast("Could not open the delivery note.")}
}
function setCrate(id,v){const o=ord(id);if(!o)return;o.crate=v.trim();save();toast("Crate saved")}
function printReceiptBtn(id){printReceipt(id)}
/* ===== Customer updates (WhatsApp, one tap per customer) ===== */
let updFile=null,updAll=false;
function updOk(c){const n=waNum(c.phone);return n.length>=10&&n.length<=15}
function updWhy(c){if(!String(c.phone||"").trim())return "No phone number. Add one in Customers.";if(!updOk(c))return "Number looks wrong. Check it in Customers.";return ""}
V.upd=function(){
 const sent=S.updSent||{};
 const all=S.customers;
 const ok=all.filter(c=>updOk(c)&&updTarget(c));
 const notSent=ok.filter(c=>!sent[c.id]);
 const canPhoto=!!updFile;
 const rowsH=all.map((c,k)=>{
  const why=updWhy(c);
  let status;
  if(why)status='<span class="tag bad">'+esc(why)+'</span>';
  else if(sent[c.id])status='<span class="tag ok">Sent '+esc(sent[c.id])+'</span>';
  else status='<span class="tag">Not sent</span>';
  const actions=why?'<span class="mut">-</span>':
   ((canPhoto?'<button class="btn sm alt" onclick="updShare('+c.id+')">Share photo</button> ':'')+
   '<button class="btn sm" onclick="updSend('+c.id+')">Send on WhatsApp</button> '+
   (sent[c.id]?'<button class="btn sm alt" onclick="updUnmark('+c.id+')">Unmark</button>':''));
  return '<tr><td style="text-align:center">'+(k+1)+'</td><td>'+esc(c.name||"-")+'</td><td>'+esc(c.phone||"-")+'</td><td style="text-align:center">'+status+'</td><td style="text-align:right;white-space:nowrap">'+actions+'</td></tr>';
 }).join("");
 return '<div class="card"><h3>Send update to customers</h3>'+
  '<p class="mut">Write your update once, then send it. Use {name} to insert each customer\'s name. Only send to customers who agreed to receive updates.</p>'+
  '<textarea id="upd_msg" rows="5" style="width:100%;border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)" oninput="S.updMsg=this.value;save()" placeholder="e.g. Hi {name}, new Jogger Pants just arrived in 6 colours!">'+esc(S.updMsg||"")+'</textarea>'+
  '<div class="row" style="margin-top:10px"><label class="mut">Photo (optional): <input type="file" accept="image/*" onchange="updPick(this)"></label>'+
  (canPhoto?'<span class="mut">'+esc(updFile.name)+'</span> <button class="btn alt sm" onclick="updClearPhoto()">Remove photo</button>':'')+'</div>'+
  '<div class="row" style="margin-top:8px">'+updTagSelect()+'<button class="btn" onclick="updToggleAll()">'+(updAll?'Hide customer list':'Send to every customer')+'</button><button class="btn alt" onclick="updMarkAll()">Mark all as sent</button><span style="flex:1"></span><button class="btn alt sm" onclick="updReset()">Clear sent list</button></div>'+
  '<p class="mut" style="margin:8px 0 0">Total: '+all.length+' · Ready to send: '+ok.length+' · Sent: '+(ok.length-notSent.length)+' · Not sent: '+notSent.length+' · Missing or wrong number: '+(all.length-ok.length)+'</p>'+
  '</div>'+
  (updAll?updLinks():'')+
  '<div class="card scroll"><table><thead><tr><th style="width:6%">No.</th><th style="text-align:left">Name</th><th style="text-align:left">WhatsApp</th><th style="width:24%;text-align:center">Status</th><th style="width:34%;text-align:right">Action</th></tr></thead><tbody>'+
  (rowsH||'<tr><td colspan="5" class="mut">No customers yet. Add them in Customers.</td></tr>')+
  '</tbody></table></div>';
};
function updPick(input){updFile=(input.files&&input.files[0])||null;render()}
function updClearPhoto(){updFile=null;render()}
function updSend(id){
 const c=S.customers.find(x=>x.id==id);if(!c)return;
 const m=(S.updMsg||"").trim();if(!m)return toast("Write the update message first");
 const text=m.replace(/\{name\}/g,c.name||"");
 const w=window.open("https://wa.me/"+waNum(c.phone)+"?text="+encodeURIComponent(text),"_blank");
 if(!w)return toast("Pop-up blocked. Allow pop-ups for this page and try again.");
 S.updSent=S.updSent||{};S.updSent[id]=new Date().toLocaleDateString();save();render();
}
function updUnmark(id){if(S.updSent)delete S.updSent[id];save();render()}
function updReset(){if(!confirm("Clear the sent list so everyone shows Not sent?"))return;S.updSent={};save();render()}
function updToggleAll(){updAll=!updAll;render()}
function updLinks(){
 const m=(S.updMsg||"").trim();
 if(!m)return '<div class="card"><p class="mut">Write the update message first, then tap a name below.</p></div>';
 const rowsL=S.customers.filter(updTarget).map(c=>{
  const why=updWhy(c);
  if(why)return '<div class="row"><span class="btn sm alt" style="opacity:.5;cursor:default">'+esc(c.name||"-")+'</span><span class="tag bad">'+esc(why)+'</span></div>';
  const t=m.replace(/\{name\}/g,c.name||"");const done=(S.updSent||{})[c.id];
  return '<div class="row"><a class="btn sm'+(done?' alt':'')+'" href="https://wa.me/'+waNum(c.phone)+'?text='+encodeURIComponent(t)+'" target="_blank" rel="noopener" onclick="updMarkSent('+c.id+',this)">'+esc(c.name||c.phone)+'</a><span class="mut">'+(done?'Sent '+esc(done):'Not sent')+'</span></div>';
 }).join("");
 return '<div class="card"><h3>Send to every customer</h3><p class="mut">Tap a name. WhatsApp opens with the message ready; press Send there, then come back and tap the next name. Customers with a reason shown in red cannot be sent to until that is fixed.</p>'+(rowsL||'<p class="mut">No customers yet.</p>')+'</div>';
}
function updMarkSent(id,el){const d=new Date().toLocaleDateString();S.updSent=S.updSent||{};S.updSent[id]=d;save();if(el){el.classList.add("alt");if(el.nextElementSibling)el.nextElementSibling.textContent="Sent "+d}}
async function updShare(id){
 const c=S.customers.find(x=>x.id==id);if(!c||!updFile)return;
 const text=(S.updMsg||"").trim().replace(/\{name\}/g,c.name||"");
 const f=new File([updFile],updFile.name,{type:updFile.type});
 if(!navigator.canShare||!navigator.canShare({files:[f]}))return toast("Photo sharing works on a phone. On a computer, attach the photo in WhatsApp Web.");
 try{await navigator.share({files:[f],text:text,title:"Update"});S.updSent=S.updSent||{};S.updSent[id]=new Date().toLocaleDateString();save();render()}
 catch(e){if(!e||e.name!="AbortError")toast("Could not share the photo.")}
}

 const a=snap.p,b=n.p;
 Object.keys(b).forEach(id=>{const x=b[id];if(!a[id]){addLog("Added product "+x.name);return}
  if(a[id].price!=x.price)addLog("Changed price of "+x.name+" from "+rs(a[id].price)+" to "+rs(x.price));
  const q=v=>{const m={};(v||[]).forEach(z=>m[z.s+" / "+z.c]=z.q);return m};const qa=q(a[id].v),qb=q(x.v);
  new Set([...Object.keys(qa),...Object.keys(qb)]).forEach(k=>{if(qa[k]!==qb[k])addLog("Changed stock of "+x.name+" ("+k+") from "+(qa[k]??0)+" to "+(qb[k]??0))});
 });
 Object.keys(a).forEach(id=>{if(!b[id])addLog("Removed product "+a[id].name)});
 const oa=snap.o,ob=n.o;
 Object.keys(ob).forEach(id=>{const x=ob[id],y=oa[id];
  if(!y){addLog("New order "+id+" for "+(x.cust||"-")+" ("+rs(x.tot)+")");return}

 });
 snap=n}catch(e){}}

V.whs=function(){
 const wc=S.customers.filter(c=>(c.tags||[]).includes("Wholesale"));
 const crates=S.crates.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+c.pieces+' pieces</td><td>'+rs(c.price)+'</td><td class="mut">'+c.items.map(i=>esc(i.p)+" "+esc(i.c)+" "+esc(i.s)+" x"+i.q).join("<br>")+'</td><td style="text-align:right"><button class="btn sm alt" onclick="crateDel('+c.id+')">Delete</button></td></tr>').join("");
 const orders=S.worders.map(o=>'<tr><td><b>'+esc(o.id)+'</b><br><span class="mut">'+esc(o.date)+'</span></td><td>'+esc(o.cust)+'</td><td>'+esc(o.crate)+' x '+o.n+'</td><td>'+rs(o.total)+'</td><td><input type="number" value="'+(o.paid||0)+'" style="width:110px" onchange="worderSet(\''+o.id+'\',\'paid\',this.value)"><br><span class="mut">Balance '+rs(Math.max(0,o.total-(o.paid||0)))+'</span></td><td><select onchange="worderSet(\''+o.id+'\',\'status\',this.value)">'+WSTAT.map(x=>'<option'+(o.status==x?' selected':'')+'>'+x+'</option>').join("")+'</select></td><td style="text-align:right;white-space:nowrap"><button class="btn sm alt" onclick="whsPackPdf(\''+o.id+'\')">Packing list</button> <button class="btn sm alt" onclick="whsBillPdf(\''+o.id+'\')">Bill PDF</button> <button class="btn sm alt" onclick="worderDel(\''+o.id+'\')">Delete</button></td></tr>').join("");
 return '<div class="card"><h3>Wholesale crates</h3><p class="mut">Describe a crate, one item per line: product, colour, size, quantity. Example line: Jogger Pants, Black, 32, 2</p>'+
  '<div class="row"><input id="cr_n" placeholder="Crate name, e.g. Crate A" style="width:200px"><input id="cr_p" type="number" placeholder="Crate price (Rs)" style="width:180px"></div>'+
  '<textarea id="cr_l" rows="5" style="width:100%;border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)" placeholder="Jogger Pants, Black, 32, 2&#10;Jogger Pants, Navy, 30, 3"></textarea>'+
  '<div class="row" style="margin-top:8px"><button class="btn" onclick="crateAdd()">Save crate</button></div></div>'+
  '<div class="card scroll"><div class="row"><h3 style="margin:0;flex:1">Crate list</h3><button class="btn" onclick="crateOffer()">Send crate offer to wholesale customers</button></div><table style="margin-top:8px"><thead><tr><th style="text-align:left">Crate</th><th style="text-align:left">Pieces</th><th style="text-align:left">Price</th><th style="text-align:left">Contents</th><th></th></tr></thead><tbody>'+(crates||'<tr><td colspan="5" class="mut">No crates yet.</td></tr>')+'</tbody></table></div>'+
  '<div class="card"><h3>New wholesale order</h3>'+(wc.length?'':'<p class="mut">No customers tagged Wholesale yet. Tag them on the Customers tab first.</p>')+
  '<div class="row"><select id="wo_c">'+wc.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'</select><select id="wo_cr">'+S.crates.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' ('+rs(c.price)+')</option>').join("")+'</select><input id="wo_n" type="number" min="1" placeholder="Crates" style="width:110px"><input id="wo_pd" type="number" placeholder="Paid so far (Rs)" style="width:160px"><select id="wo_st">'+WSTAT.map(x=>'<option>'+x+'</option>').join("")+'</select><input id="wo_d" type="date"><button class="btn" onclick="worderAdd()">Add order</button></div></div>'+
  '<div class="card scroll"><h3>Wholesale orders</h3><table><thead><tr><th style="text-align:left">Order</th><th style="text-align:left">Customer</th><th style="text-align:left">Crates</th><th style="text-align:left">Total</th><th style="text-align:left">Paid</th><th style="text-align:left">Status</th><th></th></tr></thead><tbody>'+(orders||'<tr><td colspan="7" class="mut">No wholesale orders yet.</td></tr>')+'</tbody></table></div>';
};

render();
</script>
</body></html>
